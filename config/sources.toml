# ── добивка RFQ-остатка ────────────────────────────────────────────────────────

[[source]]
id = "oemsecrets"
title = "OEMsecrets API"
url = "https://www.oemsecrets.com"
tier = "api"
adapter = "oemsecrets"
kind = "aggregator"
region = "global"
gives = ["price", "stock", "lead", "moq", "seller", "dc"]
auth_env = ["OEMSECRETS_API_KEY"]
rate = { rps = 1.0, daily = 10 }
query_url = "https://www.oemsecrets.com/compare/{mpn}"
enabled = true
notes = "140+ дистрибьюторов; в котировку идут только авторизованные (authorized_sellers). Без ключа пропускается; квота 10/сут по умолчанию."

[[source]]
id = "nexar"
