url = "https://octopart.com"
tier = "api"
adapter = "nexar"
kind = "aggregator"
region = "global"
gives = ["price", "stock", "lead", "moq", "packaging", "seller", "lifecycle"]
auth_env = ["NEXAR_CLIENT_ID", "NEXAR_CLIENT_SECRET"]
rate = { rps = 1.0 }
query_url = "https://octopart.com/search?q={mpn}"
