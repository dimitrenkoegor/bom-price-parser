# Реестр площадок котировщика. Это ДАННЫЕ, не код — включать/выключать источники правкой этого файла.
# Формат записи общий с count pars (docs там: docs/sources.md); здесь только tier = "api".
#
# kind:  franchise  — авторизованный дистрибьютор, опрашивается в основном проходе;
#        aggregator — добивка RFQ-остатка, продавцы фильтруются по authorized_sellers
#                     из config/settings.toml.
# rate.daily — суточная квота, счётчик в work/quota.json (для oemsecrets перекрывается
#              переменной OEMSECRETS_DAILY_LIMIT в .env).

[[source]]
id = "digikey"
title = "DigiKey"
url = "https://www.digikey.com"
tier = "api"
adapter = "digikey"
kind = "franchise"
region = "global"
gives = ["price", "stock", "lead", "moq", "packaging", "lifecycle", "rohs"]
auth_env = ["DIGIKEY_CLIENT_ID", "DIGIKEY_CLIENT_SECRET"]
rate = { rps = 2.0, daily = 1000 }
query_url = "https://www.digikey.com/en/products/result?keywords={mpn}"
enabled = true
notes = "Product Information v4, OAuth2 client_credentials. Валюта USD."

