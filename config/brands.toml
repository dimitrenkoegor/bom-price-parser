  "AC-DC", "DC-DC", "AC/DC", "DC/DC", "SMD", "SMT", "THT", "ROHS", "PBF",
  "TYPE-C", "TYPE-A", "TYPE-B", "USB", "USB2.0", "USB3.0", "USB3.1", "USB3.2",
